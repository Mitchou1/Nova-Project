name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: pip install pytest

      - name: Verifier la syntaxe
        run: python -m compileall -q software

      - name: Lancer les tests
        run: pytest software/tests -q
